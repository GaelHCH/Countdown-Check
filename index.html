<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Countdown Check App</title>
</head>
<body>
    <h1>Countdown Check</h1>

    <!--
    IMPORTANT NOTES:

    1. To open with live server, click go live and paste this address on the browser: http://localhost:5500/
    2. The index.html file must always be right below the main project folder, not inside any src files
    3. To view console errors, go to the browser tab, then click F12 to view console

    -->

    <div class ="input-row">
        <input type="text" id="activity" placeholder="Enter your activity">
        <input type="number" id="start" placeholder="Enter a number">
        <button id="set">Set</button>
    </div>

    <div class="activity-count-row">
        <p id="activityText"></p>
        <h2 id="count">0</h2>
    </div>

    <button id="check">✓ Check</button>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
